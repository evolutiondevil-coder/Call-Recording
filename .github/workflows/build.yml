name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Optional: add these repository secrets to sign the release APK with your own key.
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p signing
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > signing/release.jks
          {
            echo "storeFile=signing/release.jks"
            echo "storePassword=$SIGNING_STORE_PASSWORD"
            echo "keyAlias=$SIGNING_KEY_ALIAS"
            echo "keyPassword=$SIGNING_KEY_PASSWORD"
          } > keystore.properties

      # Build first, so the APK is always available even if a test fails.
      - name: Build APKs
        run: ./gradlew assembleRelease assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: call-recorder-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Tests and lint
        run: ./gradlew testDebugUnitTest lintDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-screenshots
          if-no-files-found: ignore
          path: |
            app/build/reports/
            app/build/screenshots/

  # On the default branch: if versionName in app/build.gradle.kts has no release yet, build the
  # APK signed with the app's release key and publish it as v<versionName> on the Releases page.
  release:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to release
        id: check
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ ! -f signing/signing.properties ]; then
            echo "::notice::No release key in the repository, nothing to publish"
          elif gh release view "v$version" > /dev/null 2>&1; then
            echo "Release v$version already exists"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.publish == 'true'
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.publish == 'true'

      - name: Build and publish
        if: steps.check.outputs.publish == 'true'
        run: |
          version="${{ steps.check.outputs.version }}"
          ./gradlew assembleRelease
          apk="Zapis-na-razgovori-$version.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          notes=release/RELEASE_NOTES.md
          [ -f "$notes" ] || { echo "Нова версия $version." > notes.md; notes=notes.md; }
          gh release create "v$version" "$apk" \
            --target "$GITHUB_SHA" \
            --title "Запис на разговори $version" \
            --notes-file "$notes" \
            --latest
