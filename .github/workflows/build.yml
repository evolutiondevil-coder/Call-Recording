name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Optional: add these repository secrets to sign the release APK with your own key.
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p signing
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > signing/release.jks
          {
            echo "storeFile=signing/release.jks"
            echo "storePassword=$SIGNING_STORE_PASSWORD"
            echo "keyAlias=$SIGNING_KEY_ALIAS"
            echo "keyPassword=$SIGNING_KEY_PASSWORD"
          } > keystore.properties

      # Build first, so the APK is always available even if a test fails.
      - name: Build APKs
        run: ./gradlew assembleRelease assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: call-recorder-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Tests and lint
        run: ./gradlew testDebugUnitTest lintDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-screenshots
          if-no-files-found: ignore
          path: |
            app/build/reports/
            app/build/screenshots/

  # When a new APK appears in release/ on the default branch, publish it on the Releases page
  # (tag v<version>, taken from the file name, e.g. Zapis-na-razgovori-1.0.0.apk -> v1.0.0).
  release:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls release/*.apk 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$apk" ]; then echo "No APK in release/"; exit 0; fi
          version=$(basename "$apk" .apk | sed 's/.*-//')
          tag="v$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          gh release create "$tag" "$apk" \
            --target "$GITHUB_SHA" \
            --title "Запис на разговори $version" \
            --notes-file release/RELEASE_NOTES.md \
            --latest
